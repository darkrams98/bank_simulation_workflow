server:
  port: 8081

spring:
  application:
    name: view-service
  datasource:
    url: jdbc:sqlite:./data/view.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: 4f8c1b2a9d7e6f3a5c0b8e2d1f4a7c9b3e6d8f0a2c5b7e9d1f3a6c8b0e2d4f7a
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  merchant:
    id: MERCHANT-0001
  psp:
    base-url: http://localhost:8082
    payment-path: /api/psp/payments

logging:
  level:
    com.alireza.viewservice: INFO
